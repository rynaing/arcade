<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hamster Roll - Mossbell Arcade</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020; font-family:'Trebuchet MS','Segoe UI',sans-serif; color:#fff; }
  #game-canvas { position:fixed; inset:0; display:block; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; padding:20px; }
  .hidden { display:none !important; }
  .panel { background:rgba(10,16,34,.94); border:2px solid #2b3a67; border-radius:20px; padding:26px 30px; max-width:560px; width:100%; box-shadow:0 16px 60px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06); backdrop-filter:blur(8px); }
  h1.title { font-size:46px; text-align:center; margin-bottom:4px; background:linear-gradient(180deg,#ffe27a,#ff9d3c); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:1px; filter:drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  .subtitle { text-align:center; color:#9fb2dd; margin-bottom:18px; font-size:14px; }
  .row { display:flex; gap:10px; margin-top:12px; }
  input[type=text] { flex:1; padding:12px 14px; border-radius:10px; border:2px solid #2b3a67; background:#0a0f22; color:#fff; font-size:16px; outline:none; }
  input[type=text]:focus { border-color:#ffb43c; }
  button { cursor:pointer; border:none; border-radius:10px; font-weight:800; font-size:15px; padding:12px 18px; color:#1a1206; background:linear-gradient(180deg,#ffd76a,#ff9d3c); box-shadow:0 4px 0 #a85f14; transition:transform .06s; font-family:inherit; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #a85f14; }
  button.secondary { background:linear-gradient(180deg,#5f7bd9,#3c56b0); color:#fff; box-shadow:0 4px 0 #24336e; }
  button.secondary:active { box-shadow:0 1px 0 #24336e; }
  button:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .btn-block { width:100%; margin-top:10px; padding:14px; font-size:17px; }
  .divider { display:flex; align-items:center; gap:12px; margin:16px 0 4px; color:#5f6f9c; font-size:13px; }
  .divider::before,.divider::after { content:''; flex:1; height:1px; background:#2b3a67; }
  .err { color:#ff7b7b; font-size:13px; min-height:20px; text-align:center; margin-top:8px; }
  .track-pick { display:flex; gap:8px; margin-top:10px; }
  .track-btn { flex:1; padding:10px 6px; font-size:12px; border-radius:12px; background:#141c38; color:#cdd8f5; border:2px solid #2b3a67; box-shadow:none; font-weight:700; }
  .track-btn small { display:block; font-weight:400; color:#8fa0cc; font-size:10px; margin-top:2px; }
  .track-btn.sel { border-color:#ffb43c; background:#2a2140; color:#ffd76a; box-shadow:0 0 12px rgba(255,180,60,.35); }
  .track-btn:active { transform:none; }
  .sect-label { font-size:12px; color:#8fa0cc; text-transform:uppercase; letter-spacing:2px; margin-top:14px; text-align:center; }
  /* lobby */
  #lobby .panel { max-width:640px; }
  .room-code { font-size:40px; letter-spacing:12px; font-weight:900; color:#ffd76a; text-align:center; margin:6px 0 2px; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  .room-hint { text-align:center; color:#9fb2dd; font-size:13px; margin-bottom:12px; }
  #player-list { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px; min-height:40px; }
  .player-chip { display:flex; align-items:center; gap:8px; background:#141c38; border:2px solid #2b3a67; border-radius:999px; padding:6px 14px 6px 8px; font-size:14px; font-weight:700; }
  .player-chip .dot { width:18px; height:18px; border-radius:50%; box-shadow:0 0 8px rgba(0,0,0,.5); }
  .player-chip .rdy { font-size:11px; color:#7bed6f; }
  .player-chip .tag { font-size:10px; background:#ffb43c; color:#1a1206; border-radius:6px; padding:1px 6px; font-weight:900; }
  .chat-box { height:160px; overflow-y:auto; background:#0a0f22; border:2px solid #2b3a67; border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:14px; }
  .chat-box .msg { margin-bottom:6px; line-height:1.35; word-wrap:break-word; }
  .chat-box .msg .n { font-weight:800; }
  .chat-box .msg.sys { color:#8fa0cc; font-style:italic; }
  .chat-box .msg .t { color:#5f6f9c; font-size:11px; margin-right:6px; }
  /* hud */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #hud .topbar { position:absolute; top:10px; left:0; right:0; display:flex; justify-content:center; gap:12px; }
  .hud-pill { background:rgba(10,15,34,.8); border:2px solid #2b3a67; border-radius:999px; padding:8px 18px; font-size:16px; font-weight:800; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  #hud-pos { color:#ffd76a; }
  #hud-track { color:#9fb2dd; font-size:13px; padding:8px 14px; }
  #standings { position:absolute; top:64px; right:10px; background:rgba(10,15,34,.72); border:2px solid #2b3a67; border-radius:12px; padding:8px 12px; font-size:13px; min-width:150px; }
  #standings .srow { display:flex; align-items:center; gap:8px; margin:3px 0; font-weight:700; }
  #standings .sdot { width:12px; height:12px; border-radius:50%; }
  #countdown { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:8; pointer-events:none; }
  #countdown span { font-size:130px; font-weight:900; color:#ffd76a; text-shadow:0 8px 0 rgba(0,0,0,.45), 0 0 60px rgba(255,180,60,.5); }
  #toast { position:fixed; bottom:130px; left:50%; transform:translateX(-50%); background:rgba(10,15,34,.92); border:2px solid #ffb43c; color:#ffd76a; border-radius:12px; padding:10px 22px; font-weight:800; z-index:9; pointer-events:none; opacity:0; transition:opacity .3s; font-size:15px; text-align:center; max-width:90vw; }
  /* race chat */
  #race-chat { position:fixed; left:12px; bottom:12px; width:290px; z-index:6; pointer-events:none; }
  #rc-msgs { display:flex; flex-direction:column; gap:4px; margin-bottom:6px; }
  .rc-msg { background:rgba(10,15,34,.82); border:1px solid #2b3a67; border-radius:8px; padding:5px 10px; font-size:13px; transition:opacity 1s; }
  .rc-msg .n { font-weight:800; }
  #rc-inputrow { display:flex; gap:6px; pointer-events:auto; }
  #rc-input { font-size:14px; padding:8px 10px; }
  #rc-toggle { position:fixed; left:12px; bottom:12px; z-index:6; width:46px; height:46px; border-radius:50%; font-size:20px; padding:0; display:none; }
  /* results */
  #results .panel { max-width:580px; }
  .res-row { display:flex; align-items:center; gap:12px; padding:10px 14px; background:#141c38; border-radius:10px; margin-bottom:8px; font-size:16px; font-weight:700; }
  .res-row .medal { font-size:22px; width:30px; text-align:center; }
  .res-row .time { margin-left:auto; color:#ffd76a; font-variant-numeric:tabular-nums; }
  .res-row .dnf { margin-left:auto; color:#8fa0cc; font-size:13px; }
  #joy { position:fixed; bottom:70px; right:20px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.25); z-index:6; display:none; touch-action:none; }
  #joy-knob { position:absolute; width:56px; height:56px; border-radius:50%; background:rgba(255,213,106,.85); left:37px; top:37px; }
  .kbd-hint { text-align:center; color:#8fa0cc; font-size:13px; margin-top:14px; }
  @media (max-width:600px){ h1.title{font-size:34px;} .panel{padding:20px;} #standings{display:none;} #race-chat{width:210px;} }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<body>
<canvas id="game-canvas"></canvas>

<div id="menu" class="screen">
  <div class="panel">
    <h1 class="title">🐹 Hamster Roll</h1>
    <div class="subtitle">roll &middot; race &middot; rumble &mdash; multiplayer hamster ball racing</div>
    <input type="text" id="name-input" maxlength="14" placeholder="your hamster name" style="width:100%">
    <div class="sect-label">Practice track</div>
    <div class="track-pick" id="solo-track-pick"></div>
    <button class="btn-block secondary" id="btn-solo">Solo practice</button>
    <div class="divider">multiplayer</div>
    <button class="btn-block" id="btn-create">Create room</button>
    <div class="row">
      <input type="text" id="code-input" maxlength="4" placeholder="CODE" style="text-transform:uppercase; max-width:110px; text-align:center; font-weight:900; letter-spacing:4px;">
      <button class="secondary" id="btn-join" style="flex:1">Join room</button>
    </div>
    <div class="err" id="menu-err"></div>
    <div class="kbd-hint">⌨️ WASD / arrows to roll &nbsp;&middot;&nbsp; Enter for chat mid-race &nbsp;&middot;&nbsp; 3 laps</div>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="panel">
    <h1 class="title" style="font-size:30px">Lobby</h1>
    <div class="room-code" id="room-code">----</div>
    <div class="room-hint">share the code &mdash; friends join from the arcade</div>
    <div class="sect-label">Track (host picks)</div>
    <div class="track-pick" id="lobby-track-pick"></div>
    <div id="player-list" style="margin-top:12px"></div>
    <div class="chat-box" id="chat-box"></div>
    <div class="row">
      <input type="text" id="chat-input" maxlength="120" placeholder="chat...">
      <button class="secondary" id="btn-send">Send</button>
    </div>
    <div class="row">
      <button class="secondary" id="btn-ready" style="flex:1">Ready ✓</button>
      <button id="btn-start" style="flex:2" disabled>Start race</button>
    </div>
    <div class="row"><button class="secondary btn-block" id="btn-leave" style="margin-top:0">Leave</button></div>
    <div class="err" id="lobby-err"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="hud-pill" id="hud-time">0:00.0</div>
    <div class="hud-pill" id="hud-pos">1st</div>
    <div class="hud-pill" id="hud-lap">Lap 1/3</div>
    <div class="hud-pill" id="hud-track">Meadow Loop</div>
  </div>
  <div id="standings"></div>
</div>
<div id="race-chat">
  <div id="rc-msgs"></div>
  <div id="rc-inputrow" class="hidden"><input type="text" id="rc-input" maxlength="120" placeholder="chat..."></div>
</div>
<button id="rc-toggle">💬</button>
<div id="countdown" class="hidden"><span id="count-num">3</span></div>

<div id="results" class="screen hidden">
  <div class="panel">
    <h1 class="title" style="font-size:32px">🏁 Results</h1>
    <div id="res-list" style="margin:16px 0"></div>
    <div class="chat-box" id="chat-box2" style="height:110px"></div>
    <div class="row">
      <input type="text" id="chat-input2" maxlength="120" placeholder="chat...">
      <button class="secondary" id="btn-send2">Send</button>
    </div>
    <div class="row">
      <button id="btn-again" style="flex:1">Back to lobby</button>
      <button class="secondary" id="btn-leave2" style="flex:1">Leave</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="joy"><div id="joy-knob"></div></div>
<script type="module">
import * as THREE from 'three';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ================= config ================= */
const SUPABASE_URL = 'https://ukrxoqsvyvlyeblubjeo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hXr3XBpmRYSDiJNiOzt6yw_DttyIY6y';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const LAPS = 3;
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const PALETTE = ['#ff5b5b','#4da3ff','#ffd23f','#7bed6f','#c77dff','#ff9f43'];
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const myId = Math.random().toString(36).slice(2,10);
let myName = localStorage.getItem('hr-name') || '';
if (myName) $('name-input').value = myName;

const TRACKS = [
  { name:'Meadow Loop', desc:'Wide grass circuit', diff:'●○○',
    rect:[-5,5,45,-35], w:10, theme:'meadow',
    bridges:[{edge:'S',f0:0.35,f1:0.65,bw:4}],
    slalom:[{edge:'N',n:3}], boosts:[{edge:'E',f0:0.30,f1:0.45},{edge:'E',f0:0.60,f1:0.75}] },
  { name:'Frost Peak', desc:'Narrow ice bridges', diff:'●●○',
    rect:[-4,4,40,-30], w:8, theme:'frost',
    bridges:[{edge:'S',f0:0.30,f1:0.55,bw:3.4},{edge:'W',f0:0.40,f1:0.62,bw:3.4}],
    slalom:[{edge:'S',n:3}], boosts:[{edge:'N',f0:0.55,f1:0.80},{edge:'E',f0:0.35,f1:0.55}] },
  { name:'Ember Circuit', desc:'Long volcanic run', diff:'●●●',
    rect:[-6,6,52,-38], w:7, theme:'ember',
    bridges:[{edge:'S',f0:0.25,f1:0.45,bw:3},{edge:'N',f0:0.62,f1:0.82,bw:3}],
    slalom:[{edge:'E',n:4},{edge:'W',n:3}], boosts:[{edge:'N',f0:0.15,f1:0.35},{edge:'S',f0:0.60,f1:0.80}] },
];

const S = {
  mode:'menu', room:null, channel:null, players:{}, order:[],
  color:'#ff5b5b', ready:false, host:false, track:0, solo:false,
  racing:false, countdownAt:0, raceStart:0, finished:false, finishTime:0,
  nextGate:0, laps:0, dizzy:0, results:[],
};
function soloBest(t){ return parseFloat(localStorage.getItem('hr-best-'+t)||'0'); }
function saveSoloBest(t,v){ localStorage.setItem('hr-best-'+t,String(v)); }

/* ================= tiny audio ================= */
let AC=null;
function beep(freq,dur=0.12,type='square',vol=0.15){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.stop(AC.currentTime+dur);
  }catch(e){}
}
function toast(msg, ms=2400){
  const t=$('toast'); t.textContent=msg; t.style.opacity=1;
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity=0, ms);
}
function fmtTime(ms){
  if(!ms || ms<=0) return '--:--.-';
  const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000), d=Math.floor(ms%1000/100);
  return m+':'+String(s).padStart(2,'0')+'.'+d;
}
function ordinal(n){ return n+(['th','st','nd','rd'][ (n%100>10&&n%100<14)?0 : Math.min(n%10,4) ]||'th'); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= chat ================= */
function addChat(boxId, name, text, color, sys=false){
  const box=$(boxId); const div=document.createElement('div');
  div.className='msg'+(sys?' sys':'');
  const t=new Date(); const ts=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  if(sys){ div.textContent=text; }
  else{
    const s=document.createElement('span'); s.className='t'; s.textContent=ts; div.appendChild(s);
    const n=document.createElement('span'); n.className='n'; n.style.color=color||'#fff'; n.textContent=name+': '; div.appendChild(n);
    const b=document.createElement('span'); b.textContent=text; div.appendChild(b);
  }
  box.appendChild(div); box.scrollTop=box.scrollHeight;
  while(box.children.length>80) box.removeChild(box.firstChild);
}
function addRaceChat(name, text, color){
  const box=$('rc-msgs'); const div=document.createElement('div');
  div.className='rc-msg';
  const n=document.createElement('span'); n.className='n'; n.style.color=color||'#fff'; n.textContent=name+': '; div.appendChild(n);
  const b=document.createElement('span'); b.textContent=text; div.appendChild(b);
  box.appendChild(div);
  while(box.children.length>4) box.removeChild(box.firstChild);
  setTimeout(()=>{ div.style.opacity=0; setTimeout(()=>div.remove(),1100); }, 7000);
}
function routeChat(p){ // p: {id,name,text,color}
  if(S.mode==='lobby') addChat('chat-box', p.name, p.text, p.color);
  else if(S.mode==='results') addChat('chat-box2', p.name, p.text, p.color);
  else addRaceChat(p.name, p.text, p.color);
}
function sendChat(text){
  text=(text||'').trim(); if(!text) return;
  const p={id:myId,name:myName,text,color:S.color};
  if(S.channel) S.channel.send({type:'broadcast',event:'chat',payload:p});
  routeChat(p);
}
$('btn-send').onclick=()=>{ sendChat($('chat-input').value); $('chat-input').value=''; };
$('chat-input').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btn-send').click(); });
$('btn-send2').onclick=()=>{ sendChat($('chat-input2').value); $('chat-input2').value=''; };
$('chat-input2').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btn-send2').click(); });
// race chat: Enter toggles, toggle button for touch
function toggleRaceChat(force){
  const row=$('rc-inputrow');
  const show = force!==undefined ? force : row.classList.contains('hidden');
  row.classList.toggle('hidden', !show);
  if(show) $('rc-input').focus(); else $('rc-input').blur();
}
$('rc-toggle').onclick=()=>toggleRaceChat();
$('rc-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ sendChat($('rc-input').value); $('rc-input').value=''; toggleRaceChat(false); }
  if(e.key==='Escape') toggleRaceChat(false);
  e.stopPropagation();
});

/* ================= track picker UI ================= */
function renderTrackPicks(){
  for(const [elId, clickable] of [['solo-track-pick',true],['lobby-track-pick',false]]){
    const el=$(elId); el.innerHTML='';
    TRACKS.forEach((t,i)=>{
      const b=document.createElement('button');
      b.className='track-btn'+(S.track===i?' sel':'');
      b.innerHTML=`${t.name}<small>${t.desc} ${t.diff}</small>`;
      if(clickable || (elId==='lobby-track-pick' && S.host)){
        b.onclick=()=>selectTrack(i);
      } else { b.style.cursor='default'; }
      el.appendChild(b);
    });
  }
}
function selectTrack(i){
  S.track=i; buildTrack(i); renderTrackPicks();
  if(S.channel && S.host) S.channel.send({type:'broadcast',event:'track',payload:{idx:i}});
}
renderTrackPicks();

/* ================= rooms + netcode ================= */
function makeCode(){ let c=''; for(let i=0;i<4;i++) c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return c; }
function setErr(id,msg){ $(id).textContent=msg||''; }

function showScreen(name){
  for(const s of ['menu','lobby','hud','results']) $(s).classList.add('hidden');
  $('countdown').classList.add('hidden');
  $('rc-inputrow').classList.add('hidden');
  $('rc-toggle').style.display = (name==='race' && 'ontouchstart' in window) ? 'block' : 'none';
  if(name==='race'){ $('hud').classList.remove('hidden'); }
  else if(name) $(name).classList.remove('hidden');
  S.mode = name==='race' ? 'racing' : name;
}

async function joinRoom(code){
  code=(code||'').toUpperCase().trim();
  myName=($('name-input').value||'').trim().slice(0,14)||'Hamster';
  localStorage.setItem('hr-name',myName);
  if(!/^[A-Z2-9]{4}$/.test(code)){ setErr('menu-err','Enter the 4-letter room code.'); return; }
  setErr('menu-err','');
  S.room=code; S.ready=false; S.solo=false; S.order=[]; S.track=0;
  const ch=sb.channel('hr:'+code,{config:{presence:{key:myId},broadcast:{ack:false}}});
  S.channel=ch;
  ch.on('presence',{event:'sync'},()=>{ renderRoster(); });
  ch.on('presence',{event:'join'},({newPresences})=>{
    for(const p of newPresences){ if(p.id!==myId){ addChat('chat-box',null,`${p.name} joined the room`,null,true); beep(660,0.08); } }
    renderRoster();
  });
  ch.on('presence',{event:'leave'},({leftPresences})=>{
    for(const p of leftPresences){ delete S.players[p.id]; addChat('chat-box',null,`${p.name} left`,null,true); }
    renderRoster();
  });
  ch.on('broadcast',{event:'chat'},({payload})=>{ if(payload.id!==myId) routeChat(payload); });
  ch.on('broadcast',{event:'pos'},({payload})=>{ onRemotePos(payload); });
  ch.on('broadcast',{event:'start'},({payload})=>{ beginRace(payload.at, payload.track); });
  ch.on('broadcast',{event:'finish'},({payload})=>{ onRemoteFinish(payload); });
  ch.on('broadcast',{event:'tolobby'},()=>{ backToLobby(); });
  ch.on('broadcast',{event:'track'},({payload})=>{ S.track=payload.idx; buildTrack(payload.idx); renderTrackPicks(); toast(`Track: ${TRACKS[payload.idx].name}`); });
  const subOk=await new Promise(res=>{
    let done=false;
    const to=setTimeout(()=>{ if(!done){ done=true; res(false); } },10000);
    ch.subscribe(status=>{
      if(done) return;
      if(status==='SUBSCRIBED'){ done=true; clearTimeout(to); res(true); }
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){ done=true; clearTimeout(to); res(false); }
    });
  });
  if(!subOk){ setErr('menu-err','Could not connect. Check your connection and retry.'); return; }
  const existing=Object.values(S.players);
  S.color=PALETTE[existing.length % PALETTE.length];
  await ch.track({id:myId,name:myName,color:S.color,ready:false,joinedAt:Date.now(),racing:false});
  await new Promise(r=>setTimeout(r,600));
  const racingNow=Object.values(S.players).some(p=>p.racing);
  if(racingNow){
    await leaveRoom();
    setErr('menu-err','That room is mid-race — try again in a bit.');
    return;
  }
  $('room-code').textContent=code;
  $('chat-box').innerHTML='';
  addChat('chat-box',null,`Welcome, ${myName}! Share code ${code} with friends.`,null,true);
  buildTrack(0); renderTrackPicks();
  showScreen('lobby');
  renderRoster();
}

async function leaveRoom(){
  try{ if(S.channel){ await S.channel.untrack(); await sb.removeChannel(S.channel); } }catch(e){}
  S.channel=null; S.room=null; S.players={}; S.order=[]; S.ready=false; S.host=false;
  S.racing=false; S.finished=false; S.results=[]; S.track=0;
  for(const id of Object.keys(remoteBalls)){ scene.remove(remoteBalls[id].group); delete remoteBalls[id]; }
  $('rc-msgs').innerHTML='';
  buildTrack(0); renderTrackPicks();
  showScreen('menu');
}

function amHost(){
  const ps=Object.values(S.players);
  if(!ps.length) return true;
  return ps.slice().sort((a,b)=>a.joinedAt-b.joinedAt)[0].id===myId;
}

function renderRoster(){
  if(S.channel){
    const st=S.channel.presenceState();
    S.players={};
    for(const k of Object.keys(st)){ const p=st[k][0]; S.players[p.id]=p; }
  }
  S.order=Object.values(S.players).sort((a,b)=>a.joinedAt-b.joinedAt);
  S.host=amHost();
  const list=$('player-list'); list.innerHTML='';
  for(const p of S.order){
    const d=document.createElement('div'); d.className='player-chip';
    d.innerHTML=`<span class="dot" style="background:${p.color}"></span><span>${escapeHtml(p.name)}</span>`+
      (p.id===myId&&S.host?'<span class="tag">HOST</span>':'')+
      (p.ready?'<span class="rdy">ready ✓</span>':'');
    list.appendChild(d);
  }
  renderTrackPicks();
  const others=S.order.filter(p=>p.id!==myId);
  const allReady=others.length>0 && others.every(p=>p.ready);
  $('btn-start').disabled=!(S.host && (others.length===0 || allReady));
  $('btn-start').textContent = others.length===0 ? 'Start race (solo)' : (allReady?'Start race':'Waiting for ready…');
  $('btn-ready').textContent=S.ready?'Not ready':'Ready ✓';
}

/* ---- track construction ---- */
let trackGroup=null;
const solids=[];   // {x1,z1,x2,z2,y1,y2}
const boosts=[];   // {x1,z1,x2,z2,dx,dz}
let GATES=[];
const GATE_R=5;
let animPads=[];
let particles=null, particleVel=null, particleTheme=null;

function addBox(x1,z1,x2,z2,y1,y2,color,opts={}){
  const w=x2-x1,d=z2-z1,h=y2-y1;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color,roughness:0.9,metalness:0.04}));
  m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  m.castShadow=!!opts.cast; m.receiveShadow=true;
  trackGroup.add(m);
  if(opts.solid!==false) solids.push({x1,z1,x2,z2,y1,y2});
  return m;
}
function chevronTexture(){
  const c=document.createElement('canvas'); c.width=64; c.height=128;
  const x=c.getContext('2d'); x.clearRect(0,0,64,128);
  x.fillStyle='rgba(255,255,255,0.95)';
  for(let i=0;i<3;i++){ const y=18+i*40;
    x.beginPath(); x.moveTo(8,y); x.lineTo(32,y+22); x.lineTo(56,y); x.lineTo(56,y+14); x.lineTo(32,y+36); x.lineTo(8,y+14); x.closePath(); x.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
let chevTex=null;

function buildTrack(idx){
  if(S.racing) return;
  if(trackGroup){
    scene.remove(trackGroup);
    trackGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose();
      if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.map&&m.map!==chevTex) m.map.dispose(); m.dispose(); }); } });
  }
  trackGroup=new THREE.Group(); scene.add(trackGroup);
  solids.length=0; boosts.length=0; animPads.length=0; GATES=[];
  const T=TRACKS[idx], th=THEMES[T.theme];
  const [x0,z0,x1,z1]=T.rect, w=T.w;
  const forgiving=S.solo; // practice mode: guard walls everywhere
  // theme the world
  skyUni.top.value.set(th.skyTop); skyUni.bot.value.set(th.skyBot);
  scene.fog.color.set(th.fog);
  sun.color.set(th.sun); sun.intensity=th.sunI; hemi.intensity=th.hemiI;
  stars.material.opacity=th.stars;
  const cx=(x0+x1)/2, cz=(z0+z1)/2;
  const span=Math.max(x1-x0, z0-z1);
  sun.position.set(cx+40,70,cz+25); sun.target.position.set(cx,0,cz);
  Object.assign(sun.shadow.camera,{left:-span*0.75,right:span*0.75,top:span*0.75,bottom:-span*0.75,far:220});
  sun.shadow.camera.updateProjectionMatrix();

  const cx0=x0+w/2, cx1=x1-w/2, cz0=z0-w/2, cz1=z1+w/2;
  const edgePoint=(edge,f)=>{
    if(edge==='N') return [cx0+(cx1-cx0)*f, cz0];
    if(edge==='E') return [cx1, cz0+(cz1-cz0)*f];
    if(edge==='S') return [cx1+(cx0-cx1)*f, cz1];
    return [cx0, cz1+(cz0-cz1)*f];
  };
  const edgeDir=edge=> edge==='N'?[1,0]:edge==='E'?[0,-1]:edge==='S'?[-1,0]:[0,1];
  const edgeBox=(edge,f0,f1,bw)=>{
    const [ax,az]=edgePoint(edge,f0), [bx,bz]=edgePoint(edge,f1);
    const horiz=(edge==='N'||edge==='S');
    const c=horiz ? (edge==='N'? z0-w/2 : z1+w/2) : (edge==='E'? x1-w/2 : x0+w/2);
    if(horiz) return [Math.min(ax,bx), c-bw/2, Math.max(ax,bx), c+bw/2];
    return [c-bw/2, Math.min(az,bz), c+bw/2, Math.max(az,bz)];
  };
  const bridgeOn=e=>T.bridges.find(b=>b.edge===e);
  for(const e of ['N','E','S','W']){
    const br=bridgeOn(e);
    if(br){
      let [ax,az,bx,bz]=edgeBox(e,0,br.f0,w); addBox(ax,az,bx,bz,-4,0,th.track);
      [ax,az,bx,bz]=edgeBox(e,br.f1,1,w); addBox(ax,az,bx,bz,-4,0,th.track);
      [ax,az,bx,bz]=edgeBox(e,br.f0,br.f1,br.bw); addBox(ax,az,bx,bz,-4,0,th.trim);
      // side rails: low in multiplayer, full walls in forgiving practice
      const rh=forgiving?2.5:0.9, horiz=(e==='N'||e==='S');
      const [qx,qz,rx,rz]=edgeBox(e,br.f0,br.f1,br.bw);
      if(horiz){
        addBox(qx,qz-0.45,rx,qz,0,rh,th.wall); addBox(qx,rz,rx,rz+0.45,0,rh,th.wall);
      }else{
        addBox(qx-0.45,qz,qx,rz,0,rh,th.wall); addBox(rx,qz,rx+0.45,rz,0,rh,th.wall);
      }
    }else{
      const [ax,az,bx,bz]=edgeBox(e,0,1,w); addBox(ax,az,bx,bz,-4,0,th.track);
    }
  }
  // outer walls (always)
  addBox(x0-1,z0,x1+1,z0+1,0,2.5,th.wall);
  addBox(x0-1,z1-1,x1+1,z1,0,2.5,th.wall);
  addBox(x1,z1-1,x1+1,z0+1,0,2.5,th.wall);
  addBox(x0-1,z1-1,x0,z0+1,0,2.5,th.wall);
  if(forgiving){ // inner guard walls: practice mode is forgiving
    addBox(x0,z0-w-1,x1,z0-w,0,2.5,th.wall);
    addBox(x0,z1+w,x1,z1+w+1,0,2.5,th.wall);
    addBox(x1-w-1,z1,x1-w,z0,0,2.5,th.wall);
    addBox(x0+w,z1,x0+w+1,z0,0,2.5,th.wall);
  }
  // slalom blocks
  for(const s of T.slalom){
    for(let i=1;i<=s.n;i++){
      const f=i/(s.n+1);
      const [px,pz]=edgePoint(s.edge,f);
      const horiz=(s.edge==='N'||s.edge==='S');
      const off=(i%2?1:-1)*w*0.22, sz=Math.min(2.4,w*0.24);
      const bx=horiz?px:px+off, bz=horiz?pz+off:pz;
      addBox(bx-sz/2,bz-sz/2,bx+sz/2,bz+sz/2,0,1.5,th.block,{cast:true});
    }
  }
  // boost pads
  chevTex=chevTex||chevronTexture();
  for(const b of T.boosts){
    const [ax,az,bx,bz]=edgeBox(b.edge,b.f0,b.f1,w*0.7);
    const [dx,dz]=edgeDir(b.edge);
    const len=Math.hypot(bx-ax,bz-az), pw=Math.min(bx-ax,bz-az);
    const g=new THREE.Group(); g.position.set((ax+bx)/2,0.06,(az+bz)/2);
    g.rotation.y=Math.atan2(-dx,-dz);
    const mat=new THREE.MeshBasicMaterial({map:chevTex.clone(),transparent:true,opacity:0.9,color:0x54e8ff});
    mat.map.needsUpdate=true; mat.map.repeat.set(1,Math.max(1,Math.round(len/6)));
    const pad=new THREE.Mesh(new THREE.PlaneGeometry(pw,len),mat);
    pad.rotation.x=-Math.PI/2; g.add(pad); trackGroup.add(g);
    animPads.push(mat);
    boosts.push({x1:Math.min(ax,bx),z1:Math.min(az,bz),x2:Math.max(ax,bx),z2:Math.max(az,bz),dx,dz});
  }
  // gates along centerline
  const segLens={N:cx1-cx0,E:cz0-cz1,S:cx1-cx0,W:cz0-cz1};
  const total=2*(segLens.N+segLens.E);
  const spacing=13, startD=7;
  const n=Math.max(6,Math.floor((total-startD)/spacing));
  const walk=d=>{
    for(const e of ['N','E','S','W']){
      if(d<=segLens[e]){ const f=d/segLens[e]; return edgePoint(e,f); }
      d-=segLens[e];
    }
    return edgePoint('N',0);
  };
  for(let i=0;i<n;i++) GATES.push(walk(startD+i*spacing));
  {
    const ringGeo=new THREE.TorusGeometry(GATE_R,0.22,10,44);
    GATES.forEach(([gx,gz],i)=>{
      const ring=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:i===0?0xffd76a:0x54e8ff,transparent:true,opacity:0.6}));
      ring.rotation.x=Math.PI/2; ring.position.set(gx,1.3,gz); trackGroup.add(ring);
    });
  }
  // start gantry + checkered line
  {
    const [gx,gz]=GATES[0];
    const postG=new THREE.BoxGeometry(0.8,5.5,0.8);
    const postM=new THREE.MeshStandardMaterial({color:th.wall,roughness:0.6});
    for(const s of [-1,1]){ const p=new THREE.Mesh(postG,postM); p.position.set(gx,gz+s*(w/2+0.6)); p.castShadow=true; trackGroup.add(p); }
    const beam=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.9,w+2.4),postM);
    beam.position.set(gx,5.5,gz); beam.castShadow=true; trackGroup.add(beam);
    const bc=document.createElement('canvas'); bc.width=512; bc.height=64;
    const bx2=bc.getContext('2d');
    bx2.fillStyle='#101828'; bx2.fillRect(0,0,512,64);
    bx2.font='900 40px Trebuchet MS'; bx2.textAlign='center'; bx2.fillStyle='#ffd76a';
    bx2.fillText('🐹 HAMSTER ROLL',256,46);
    const bt=new THREE.CanvasTexture(bc);
    const banner=new THREE.Mesh(new THREE.PlaneGeometry(w+1.6,1.5),new THREE.MeshBasicMaterial({map:bt,transparent:false}));
    banner.position.set(gx+0.45,4.4,gz); banner.rotation.y=Math.PI/2; trackGroup.add(banner);
    for(let i=0;i<5;i++){ const sq=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.06,1.4),
      new THREE.MeshBasicMaterial({color:(i%2)?0x111111:0xffffff}));
      sq.position.set(gx,0.04,gz-w/2+1+i*(w-2)/4); trackGroup.add(sq); }
  }
  // ambient particles
  if(particles){ scene.remove(particles); particles.geometry.dispose(); particles.material.dispose(); }
  {
    const N=th.pN, pos=new Float32Array(N*3); particleVel=new Float32Array(N);
    for(let i=0;i<N;i++){
      pos[i*3]=cx+(Math.random()-0.5)*span*1.4;
      pos[i*3+1]=Math.random()*26;
      pos[i*3+2]=cz+(Math.random()-0.5)*span*1.4;
      particleVel[i]=th.vy*(0.6+Math.random()*0.8);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    particles=new THREE.Points(g,new THREE.PointsMaterial({color:th.part,size:0.4,transparent:true,opacity:0.75}));
    particles.userData={cx,cz,span};
    scene.add(particles); particleTheme=th;
  }
  $('hud-track').textContent=T.name;
}

function spawnPos(i){
  const [gx,gz]=GATES[0];
  const offs=[-2.6,-0.9,0.9,2.6];
  const o=offs[i%offs.length];
  return new THREE.Vector3(gx-4-(i>3?2.4:0),2.2,gz+o);
}

/* ---- hamster in a spinning ball ---- */
function ballTexture(){
  const c=document.createElement('canvas'); c.width=256; c.height=128;
  const x=c.getContext('2d'); x.clearRect(0,0,256,128);
  x.strokeStyle='rgba(255,255,255,0.9)'; x.lineWidth=6;
  for(let i=0;i<3;i++){ x.beginPath(); x.arc(42+i*86,64,34,0.4,Math.PI-0.4); x.stroke(); }
  const dots=[[24,28],[80,84],[140,30],[196,78],[110,108],[226,26],[36,92],[168,104]];
  for(const [dx,dy] of dots){
    x.fillStyle='rgba(255,255,255,0.95)'; x.beginPath(); x.arc(dx,dy,10,0,7); x.fill();
    x.fillStyle='rgba(90,160,255,0.95)'; x.beginPath(); x.arc(dx,dy,5,0,7); x.fill();
  }
  return new THREE.CanvasTexture(c);
}
let ballTex=null;
function makeHamster(color){
  const g=new THREE.Group();
  ballTex=ballTex||ballTexture();
  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.62,28,20),
    new THREE.MeshPhongMaterial({map:ballTex,transparent:true,opacity:0.62,shininess:160,specular:0xaaddff}));
  ball.castShadow=true;
  g.add(ball);
  // colored equator stripe rotates WITH the ball so spin is obvious
  const stripe=new THREE.Mesh(new THREE.TorusGeometry(0.63,0.075,10,40),
    new THREE.MeshBasicMaterial({color}));
  stripe.rotation.x=Math.PI/2; ball.add(stripe);
  const ham=new THREE.Group();
  const fur=new THREE.MeshStandardMaterial({color:0xd9a066,roughness:0.9});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.30,16,12),fur); body.scale.set(1,0.9,1.15); body.castShadow=true; ham.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.20,16,12),fur); head.position.set(0,0.16,0.30); head.castShadow=true; ham.add(head);
  const earG=new THREE.SphereGeometry(0.07,10,8);
  for(const sx of [-1,1]){ const e=new THREE.Mesh(earG,fur); e.position.set(sx*0.11,0.34,0.28); ham.add(e); }
  const eyeG=new THREE.SphereGeometry(0.045,10,8); const eyeM=new THREE.MeshBasicMaterial({color:0x1a1a1a});
  for(const sx of [-1,1]){ const e=new THREE.Mesh(eyeG,eyeM); e.position.set(sx*0.09,0.20,0.46); ham.add(e); }
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,6),new THREE.MeshBasicMaterial({color:0xff8fa0}));
  nose.position.set(0,0.14,0.50); ham.add(nose);
  g.add(ham); g.userData.ham=ham; g.userData.ball=ball;
  return g;
}

/* ---- particle puffs (trail / dust / confetti) ---- */
function puffTexture(){
  const c=document.createElement('canvas'); c.width=64; c.height=64;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,2,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
let puffTex=null;
const puffs=[];
function initPuffs(){
  puffTex=puffTex||puffTexture();
  for(let i=0;i<90;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:puffTex,transparent:true,opacity:0,depthWrite:false}));
    s.visible=false; scene.add(s);
    puffs.push({s,life:0,max:1,vy:0,grow:0});
  }
}
function puff(x,y,z,color,scale,life,vy=0,grow=1){
  const p=puffs.find(p=>p.life<=0); if(!p) return;
  p.s.visible=true; p.s.position.set(x,y,z);
  p.s.material.color.set(color); p.s.scale.set(scale,scale,1);
  p.life=life; p.max=life; p.vy=vy; p.grow=grow; p.base=scale;
}
function updatePuffs(dt){
  for(const p of puffs){
    if(p.life<=0) continue;
    p.life-=dt;
    if(p.life<=0){ p.s.visible=false; continue; }
    const k=p.life/p.max;
    p.s.material.opacity=k*0.55;
    p.s.position.y+=p.vy*dt;
    const sc=p.base*(1+(1-k)*p.grow);
    p.s.scale.set(sc,sc,1);
  }
}
initPuffs();

/* ================= player physics (tested) ================= */
const ball={ pos:new THREE.Vector3(0,2,0), vel:new THREE.Vector3(), r:0.55, grounded:false };
const playerMesh=makeHamster(PALETTE[0]); scene.add(playerMesh);
let playerLabel=null;
const keys={};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('keydown',e=>{
  if(e.key==='Enter' && S.mode==='racing' && (document.activeElement===document.body||document.activeElement===canvas)){
    e.preventDefault(); toggleRaceChat();
  }
});
let camYaw=Math.PI/2;
const joyVec={x:0,y:0};
function inputVec(){
  let x=0,z=0;
  if(keys['a']||keys['arrowleft'])x-=1; if(keys['d']||keys['arrowright'])x+=1;
  if(keys['w']||keys['arrowup'])z-=1; if(keys['s']||keys['arrowdown'])z+=1;
  x+=joyVec.x; z+=joyVec.y;
  const l=Math.hypot(x,z); if(l>1){x/=l;z/=l;}
  const s=Math.sin(camYaw),c=Math.cos(camYaw);
  return {x:x*c - z*s, z:x*s + z*c};
}
function collideWorld(){
  ball.grounded=false;
  for(const b of solids){
    const cx=clamp(ball.pos.x,b.x1,b.x2), cy=clamp(ball.pos.y,b.y1,b.y2), cz=clamp(ball.pos.z,b.z1,b.z2);
    let dx=ball.pos.x-cx, dy=ball.pos.y-cy, dz=ball.pos.z-cz;
    const d2=dx*dx+dy*dy+dz*dz;
    if(d2 < ball.r*ball.r){
      let d=Math.sqrt(d2), nx,ny,nz;
      if(d>1e-6){ nx=dx/d; ny=dy/d; nz=dz/d; }
      else{
        const px=Math.min(ball.pos.x-b.x1,b.x2-ball.pos.x), py=Math.min(ball.pos.y-b.y1,b.y2-ball.pos.y), pz=Math.min(ball.pos.z-b.z1,b.z2-ball.pos.z);
        if(py<=px&&py<=pz){ nx=0;ny=1;nz=0; d=0; } else if(px<=pz){ nx=1;ny=0;nz=0; d=0; } else { nx=0;ny=0;nz=1; d=0; }
      }
      const push=ball.r-d;
      ball.pos.x+=nx*push; ball.pos.y+=ny*push; ball.pos.z+=nz*push;
      const vn=ball.vel.x*nx+ball.vel.y*ny+ball.vel.z*nz;
      if(vn<0){ ball.vel.x-=1.4*vn*nx; ball.vel.y-=1.4*vn*ny; ball.vel.z-=1.4*vn*nz; }
      if(ny>0.7) ball.grounded=true;
    }
  }
}
function respawn(){
  const gi=(S.nextGate+GATES.length-1)%GATES.length;
  const [gx,gz]=GATES[gi];
  ball.pos.set(gx,2.5,gz); ball.vel.set(0,0,0);
  S.dizzy=1.6; toast('💫 dizzy!'); beep(220,0.25,'sawtooth',0.12);
}
let boostPuffT=0;
function stepPhysics(dt, racing){
  const ctl = S.dizzy>0 ? 0.35 : 1;
  if(S.dizzy>0) S.dizzy-=dt;
  if(racing && !S.finished){
    const iv=inputVec();
    const acc=(ball.grounded?30:13)*ctl;
    ball.vel.x+=iv.x*acc*dt; ball.vel.z+=iv.z*acc*dt;
  }
  ball.vel.y-=26*dt;
  for(const p of boosts){
    if(ball.pos.x>p.x1&&ball.pos.x<p.x2&&ball.pos.z>p.z1&&ball.pos.z<p.z2&&Math.abs(ball.pos.y)<2){
      ball.vel.x+=p.dx*36*dt; ball.vel.z+=p.dz*36*dt;
      boostPuffT+=dt;
      if(boostPuffT>0.05){ boostPuffT=0; puff(ball.pos.x,ball.pos.y,ball.pos.z,0x54e8ff,1.2,0.4,1,2); }
    }
  }
  const hs0=Math.hypot(ball.vel.x,ball.vel.z), max=ball.grounded?15:22;
  if(hs0>max){ const k=max/hs0; ball.vel.x*=k; ball.vel.z*=k; }
  const wasGrounded=ball.grounded, fallV=ball.vel.y;
  ball.pos.x+=ball.vel.x*dt; ball.pos.y+=ball.vel.y*dt; ball.pos.z+=ball.vel.z*dt;
  collideWorld();
  if(ball.grounded && !wasGrounded && fallV<-9){
    for(let i=0;i<6;i++) puff(ball.pos.x+(Math.random()-0.5)*0.8,ball.pos.y-0.2,ball.pos.z+(Math.random()-0.5)*0.8,0xffffff,0.9,0.5,1.2,2.2);
  }
  if(ball.grounded){
    const f=1-(racing?0.35:1.6)*dt; ball.vel.x*=f; ball.vel.z*=f;
  }
  if(ball.pos.y<-8 && racing && !S.finished) respawn();
  if(racing && !S.finished){
    const [gx,gz]=GATES[S.nextGate];
    const d=Math.hypot(ball.pos.x-gx,ball.pos.z-gz);
    if(d<GATE_R && Math.abs(ball.pos.y)<4){
      if(S.nextGate===0){
        S.laps++;
        if(S.laps>LAPS){ doFinish(); }
        else { $('hud-lap').textContent=`Lap ${S.laps}/${LAPS}`; beep(880,0.15); toast(`Lap ${S.laps}/${LAPS}`); }
      } else if(S.nextGate===3){ beep(520,0.1); }
      S.nextGate=(S.nextGate+1)%GATES.length;
    }
  }
}
function myProgress(){
  const frac = S.nextGate===0 ? GATES.length : S.nextGate;
  const [gx,gz]=GATES[S.nextGate];
  const d=Math.hypot(ball.pos.x-gx,ball.pos.z-gz);
  return S.laps*GATES.length + frac - d/100;
}

/* ================= race flow ================= */
const remoteBalls={};
let posTimer=0, resultsShown=false, firstFinishAt=0, trailT=0;

function setPlayerColor(c){
  playerMesh.traverse(o=>{ if(o.geometry && o.geometry.type==='TorusGeometry') o.material.color.set(c); });
}
function refreshLabel(){
  if(playerLabel) playerMesh.remove(playerLabel);
  playerLabel=makeLabel(myName||'Hamster', S.color);
  playerLabel.position.y=1.5; playerMesh.add(playerLabel);
}
function beginRace(at, track){
  S.racing=false;
  if(track!==undefined) S.track=track;
  buildTrack(S.track); renderTrackPicks();
  const si=S.order.findIndex(p=>p.id===myId);
  ball.pos.copy(spawnPos(si<0?0:si));
  ball.vel.set(0,0,0);
  S.laps=0; S.nextGate=0; S.dizzy=0; S.finished=false; S.finishTime=0;
  S.countdownAt=at; S.results=[]; resultsShown=false; firstFinishAt=0;
  setPlayerColor(S.color); refreshLabel();
  $('hud-lap').textContent=`Lap 1/${LAPS}`;
  $('hud-pos').textContent='—';
  showScreen('race');
  $('countdown').classList.remove('hidden');
  if(S.channel) S.channel.track({id:myId,name:myName,color:S.color,ready:S.ready,joinedAt:Date.now(),racing:true});
  for(const p of S.order){ if(p.id!==myId) ensureRemote(p); }
}
function ensureRemote(p){
  if(remoteBalls[p.id]) return remoteBalls[p.id];
  const group=makeHamster(p.color);
  const label=makeLabel(p.name,p.color); label.position.y=1.5; group.add(label);
  const sp=spawnPos(S.order.findIndex(q=>q.id===p.id));
  group.position.copy(sp);
  scene.add(group);
  const rb={group,target:sp.clone(),prog:0,finished:false,finishTime:0,name:p.name,color:p.color};
  remoteBalls[p.id]=rb; return rb;
}
function onRemotePos(pl){
  if(pl.id===myId || !S.racing) return;
  let rb=remoteBalls[pl.id];
  if(!rb){ const p=S.players[pl.id]; if(!p) return; rb=ensureRemote(p); }
  rb.target.set(pl.p[0],pl.p[1],pl.p[2]);
  rb.prog=pl.prog;
  const d=rb.target.distanceTo(ball.pos);
  if(d<1.4 && d>0.01 && !S.finished){
    const push=(1.4-d)*10;
    ball.vel.x+=(ball.pos.x-rb.target.x)/d*push;
    ball.vel.z+=(ball.pos.z-rb.target.z)/d*push;
  }
}
function racePositions(){
  const arr=[{id:myId,name:myName+' (you)',color:S.color,prog:S.finished?1e9:myProgress(),finished:S.finished,time:S.finishTime}];
  for(const id of Object.keys(remoteBalls)){
    const rb=remoteBalls[id];
    arr.push({id,name:rb.name,color:rb.color,prog:rb.finished?1e9:rb.prog,finished:rb.finished,time:rb.finishTime});
  }
  arr.sort((a,b)=>b.prog-a.prog);
  return arr;
}
function doFinish(){
  S.finished=true; S.finishTime=Date.now()-S.raceStart;
  beep(1040,0.3,'square',0.18); setTimeout(()=>beep(1318,0.4,'square',0.18),180);
  for(let i=0;i<24;i++)
    puff(ball.pos.x+(Math.random()-0.5)*3, ball.pos.y+Math.random()*2, ball.pos.z+(Math.random()-0.5)*3,
      PALETTE[i%PALETTE.length], 1.1, 1.4, 4+Math.random()*3, 1.5);
  if(S.solo){
    const b=soloBest(S.track);
    if(!b || S.finishTime<b){ saveSoloBest(S.track,S.finishTime); toast(`🏁 New best on ${TRACKS[S.track].name}! ${fmtTime(S.finishTime)} 🎉`, 3200); }
    else toast(`🏁 Finished! ${fmtTime(S.finishTime)}`);
    setTimeout(()=>showResults(),1800);
  } else {
    toast(`🏁 Finished! ${fmtTime(S.finishTime)}`);
    S.channel.send({type:'broadcast',event:'finish',payload:{id:myId,name:myName,time:S.finishTime}});
    S.results.push({id:myId,name:myName,color:S.color,time:S.finishTime});
    firstFinishAt=firstFinishAt||Date.now();
    maybeShowResults();
  }
}
function onRemoteFinish(pl){
  if(S.results.some(r=>r.id===pl.id)) return;
  S.results.push({id:pl.id,name:pl.name,color:(S.players[pl.id]||{}).color||'#fff',time:pl.time});
  const rb=remoteBalls[pl.id]; if(rb){ rb.finished=true; rb.finishTime=pl.time; }
  firstFinishAt=firstFinishAt||Date.now();
  addChat('chat-box2',null,`🏁 ${pl.name} finished in ${fmtTime(pl.time)}`,null,true);
  maybeShowResults();
}
function maybeShowResults(){
  if(resultsShown || S.solo) return;
  const total=Object.keys(S.players).length||1;
  if(S.results.length>=total || (firstFinishAt && Date.now()-firstFinishAt>25000)) showResults();
}
function showResults(){
  resultsShown=true; S.racing=false;
  toggleRaceChat(false);
  const list=$('res-list'); list.innerHTML='';
  const medals=['🥇','🥈','🥉'];
  const fin=S.results.slice().sort((a,b)=>a.time-b.time);
  fin.forEach((r,i)=>{
    const d=document.createElement('div'); d.className='res-row';
    d.innerHTML=`<span class="medal">${medals[i]||'🏅'}</span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${r.color}"></span><span>${escapeHtml(r.name)}</span><span class="time">${fmtTime(r.time)}</span>`;
    list.appendChild(d);
  });
  if(S.solo){
    const b=document.createElement('div'); b.className='res-row';
    b.innerHTML=`<span class="medal">⭐</span><span>Best on ${TRACKS[S.track].name}</span><span class="time">${fmtTime(soloBest(S.track))}</span>`;
    list.appendChild(b);
  } else {
    for(const id of Object.keys(S.players)){
      if(fin.some(r=>r.id===id)) continue;
      const p=S.players[id];
      const d=document.createElement('div'); d.className='res-row';
      d.innerHTML=`<span class="medal">💫</span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${p.color}"></span><span>${escapeHtml(p.name)}</span><span class="dnf">did not finish</span>`;
      list.appendChild(d);
    }
  }
  $('btn-again').textContent = S.solo ? 'Race again' : 'Back to lobby';
  showScreen('results');
}

/* ================= camera + main loop ================= */
const camDir=new THREE.Vector3(1,0,0);
const camPos=new THREE.Vector3(-8,5,0);
function updateCamera(dt){
  const hs=Math.hypot(ball.vel.x,ball.vel.z);
  if(hs>3){ camDir.set(ball.vel.x/hs,0,ball.vel.z/hs); }
  const want=new THREE.Vector3().copy(ball.pos).addScaledVector(camDir,-8).add(new THREE.Vector3(0,4.6,0));
  camPos.lerp(want,1-Math.pow(0.001,dt));
  let wob=0;
  if(S.dizzy>0){ wob=Math.sin(performance.now()*0.03)*0.5*S.dizzy; }
  camera.position.copy(camPos);
  camYaw=Math.atan2(camDir.x,-camDir.z);
  const look=new THREE.Vector3().copy(ball.pos).addScaledVector(camDir,3.5); look.y+=1+wob;
  camera.lookAt(look);
}
function updateMesh(dt){
  playerMesh.position.copy(ball.pos);
  const hs=Math.hypot(ball.vel.x,ball.vel.z);
  if(hs>0.1){
    const axis=new THREE.Vector3(ball.vel.z,0,-ball.vel.x).normalize();
    playerMesh.userData.ball.rotateOnWorldAxis(axis,hs*dt/0.62);
  }
  const ham=playerMesh.userData.ham;
  if(S.dizzy>0){ ham.rotation.y+=dt*14; }
  else{
    ham.rotation.y*=0.9;
    ham.rotation.z=clamp(-ball.vel.x*0.02,-0.3,0.3);
    ham.rotation.x=clamp(ball.vel.z*0.02,-0.3,0.3);
  }
  for(const id of Object.keys(remoteBalls)){
    const rb=remoteBalls[id];
    rb.group.position.lerp(rb.target,1-Math.pow(0.0001,dt));
  }
}
function updateHUD(){
  if(S.mode!=='racing') return;
  $('hud-time').textContent=S.finished?fmtTime(S.finishTime):fmtTime(Date.now()-S.raceStart);
  const pos=racePositions();
  $('hud-pos').textContent=ordinal(pos.findIndex(p=>p.id===myId)+1);
  const st=$('standings'); st.innerHTML='';
  pos.slice(0,6).forEach((p,i)=>{
    const d=document.createElement('div'); d.className='srow';
    d.innerHTML=`<span>${i+1}</span><span class="sdot" style="background:${p.color}"></span><span>${escapeHtml(p.name.replace(' (you)',''))}</span>${p.finished?'<span>🏁</span>':''}`;
    st.appendChild(d);
  });
}
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),1/30);
  const now=Date.now();
  if(S.countdownAt && !S.racing){
    const remain=S.countdownAt-now;
    const cd=$('countdown'), num=$('count-num');
    if(remain>0){
      const n=Math.ceil(remain/1000);
      if(num.textContent!=String(n)){ num.textContent=n; beep(440+n*110,0.12); }
    } else {
      S.countdownAt=0; S.racing=true; S.raceStart=now;
      num.textContent='GO!'; beep(880,0.3);
      setTimeout(()=>cd.classList.add('hidden'),700);
    }
  }
  const active=S.mode==='racing'||S.mode==='results'||S.mode==='menu'||S.mode==='lobby';
  if(active){
    stepPhysics(dt, S.racing && !S.finished);
    if(S.racing && !S.finished){
      const hs=Math.hypot(ball.vel.x,ball.vel.z);
      trailT+=dt;
      if(hs>9 && trailT>0.05){ trailT=0; puff(ball.pos.x,ball.pos.y-0.1,ball.pos.z,0xffffff,0.7,0.45,0.6,1.8); }
      if(S.channel){
        posTimer+=dt;
        if(posTimer>0.09){ posTimer=0;
          S.channel.send({type:'broadcast',event:'pos',payload:{id:myId,p:[ball.pos.x,ball.pos.y,ball.pos.z],lap:S.laps,gate:S.nextGate,prog:myProgress()}});
        }
      }
      if(!resultsShown && !S.solo && firstFinishAt) maybeShowResults();
    }
    updateMesh(dt); updateCamera(dt); updateHUD();
  }
  for(const m of animPads) m.map.offset.y-=dt*1.4;
  if(particles){
    const pos=particles.geometry.attributes.position, {cx,cz,span}=particles.userData;
    for(let i=0;i<pos.count;i++){
      let y=pos.getY(i)+particleVel[i]*dt;
      if(y>28) y=0; if(y<0) y=28;
      pos.setY(i,y);
    }
    pos.needsUpdate=true;
  }
  updatePuffs(dt);
  renderer.render(scene,camera);
}
buildTrack(0);
refreshLabel();
loop();

/* ================= touch joystick ================= */
if('ontouchstart' in window){
  const joy=$('joy'), knob=$('joy-knob');
  joy.style.display='block';
  let jid=null;
  const setKnob=(dx,dy)=>{ knob.style.left=(37+dx)+'px'; knob.style.top=(37+dy)+'px'; };
  joy.addEventListener('pointerdown',e=>{ jid=e.pointerId; joy.setPointerCapture(jid); });
  joy.addEventListener('pointermove',e=>{
    if(e.pointerId!==jid) return;
    const r=joy.getBoundingClientRect();
    let dx=e.clientX-(r.left+65), dy=e.clientY-(r.top+65);
    const l=Math.hypot(dx,dy), max=45;
    if(l>max){ dx=dx/l*max; dy=dy/l*max; }
    setKnob(dx,dy); joyVec.x=dx/max; joyVec.y=dy/max;
  });
  const end=e=>{ if(e.pointerId===jid){ jid=null; setKnob(0,0); joyVec.x=0; joyVec.y=0; } };
  joy.addEventListener('pointerup',end); joy.addEventListener('pointercancel',end);
}
</script>
