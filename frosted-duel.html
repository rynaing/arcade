<body>

<script>
'use strict';
/* ===== Frosted Duel: a 1v1 cupcake arena duel (solo vs bot) ===== */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const W=1280,H=720,STEP=1/120;
const G=2300,JUMP=950,SPEED=330,DASH_V=980,DASH_T=0.16,DASH_CD=0.6;
const MAG=8,FIRE_CD=0.16,RELOAD=1.1,BULLET_V=1500,BULLET_DMG=6;
const SLASH_T=0.32,SLASH_DMG=16,LUNGE_DMG=24;
const HPMAX=100,GUARD_MAX=100,ROUND_TIME=60,WIN_ROUNDS=2,MAX_ROUNDS=5;
const FW=42,FH=76,ART=1.15;   // hitbox; the cupcake is drawn ART times its base size
const NAMES=['Swirl','Gloomberry'];

/* arena: solid blocks; 'plat' blocks are one-way (stand on them, jump up through them) */
const BLOCKS=[
 {x:0,y:660,w:W,h:60,k:'floor'},
 {x:0,y:0,w:28,h:H,k:'wall'},{x:W-28,y:0,w:28,h:H,k:'wall'},
 {x:0,y:0,w:W,h:20,k:'ceil'},
 {x:604,y:450,w:72,h:210,k:'pillar'},
 {x:170,y:510,w:220,h:22,k:'plat'},{x:890,y:510,w:220,h:22,k:'plat'},
 {x:28,y:350,w:150,h:22,k:'plat'},{x:W-178,y:350,w:150,h:22,k:'plat'},
 {x:520,y:280,w:240,h:22,k:'plat'},
];
const SOLID=BLOCKS.filter(b=>b.k!=='plat');
const PICK_SPOTS=[{x:640,y:258},{x:280,y:488},{x:1000,y:488},{x:103,y:328},{x:1177,y:328},{x:640,y:428}];

const DIFF={
 easy:{react:.45,err:.22,block:.2,fire:.35,rof:2.3,agg:.25,dodge:.1,deflect:0},
 normal:{react:.3,err:.13,block:.45,fire:.55,rof:1.6,agg:.45,dodge:.25,deflect:.1},
 hard:{react:.16,err:.06,block:.75,fire:.8,rof:1.15,agg:.7,dodge:.42,deflect:.3},
};
let diff='normal';
try{const d=localStorage.getItem('fd-diff');if(DIFF[d])diff=d}catch(e){}

function sfx(n,o){if(window.ArcadeAudio)ArcadeAudio.sfx(n,o)}
function music(n){if(window.ArcadeAudio)ArcadeAudio.music(n)}

/* ===== state ===== */
let state='menu',paused=false,round=1,wins=[0,0],timeLeft=ROUND_TIME,countT=0,endT=0,slowT=0,shake=0,banner='',bannerT=0;
let fighters=[],bullets=[],parts=[],pops=[],pickup=null,pickT=0,stats=null;
const ai={t:0,move:0,blockT:0,burst:0,lungeT:0,sawSlash:false,errA:0};

function mkFighter(i){
 return{i,bot:i===1,x:i?1080:200,y:660-FH,vx:0,vy:0,face:i?-1:1,aim:i?Math.PI:0,hp:HPMAX,guard:GUARD_MAX,ammo:MAG,reloadT:0,fireCd:0,
  dashT:0,dashCd:0,dashDir:1,airDash:true,lungeW:0,slashT:0,slashCd:0,slashHit:false,lunge:false,stun:0,flash:0,ground:true,wall:0,
  wallRun:.45,wallRunning:false,wjLock:0,coy:0,jumpBuf:0,blocking:false,walk:0,ko:false,
  ctrl:{left:false,right:false,shoot:false,block:false,jumpP:false,dashP:false,slashP:false,reloadP:false}};
}
const cxOf=f=>f.x+FW/2,cyOf=f=>f.y+FH/2;
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+FW>b.x&&a.y<b.y+b.h&&a.y+FH>b.y;
function solidAt(x,y){for(const b of BLOCKS)if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return true;return false}
function clearLine(x1,y1,x2,y2){const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/14);for(let k=1;k<n;k++){const t=k/n;if(solidAt(x1+(x2-x1)*t,y1+(y2-y1)*t))return false}return true}
function shoulder(f){return{x:cxOf(f),y:f.y+FH-38}}

/* ===== match flow ===== */
function startMatch(){
 wins=[0,0];round=1;
 stats={shots:0,hits:0,slashes:0,parries:0,deflects:0,breaks:0};
 hideAll();music('brawl');startRound();
}
function startRound(){
 fighters=[mkFighter(0),mkFighter(1)];bullets=[];parts=[];pops=[];pickup=null;pickT=12;
 timeLeft=ROUND_TIME;state='count';countT=3;banner='Round '+round;bannerT=1.2;
 Object.assign(ai,{t:.6,move:0,blockT:0,burst:0,lungeT:0,sawSlash:false});
 sfx('count');
}
function roundOver(w){
 if(state!=='play')return;
 state='roundEnd';endT=2.2;
 if(w!=null)wins[w]++;
 banner=w==null?'Draw!':w===0?'Round to Swirl!':'Round to Gloomberry!';bannerT=2.2;
 sfx(w===0?'win':w===1?'lose':'dnf');
}
function matchOver(){
 state='over';music('menu');
 const won=wins[0]>wins[1];
 let rec={wins:0,streak:0,best:0};
 try{rec=Object.assign(rec,JSON.parse(localStorage.getItem('fd-record')||'{}'))}catch(e){}
 if(won){rec.wins++;rec.streak++;rec.best=Math.max(rec.best,rec.streak)}else rec.streak=0;
 try{localStorage.setItem('fd-record',JSON.stringify(rec))}catch(e){}
 $('eTitle').textContent=won?'🏆 You win the duel!':wins[0]===wins[1]?'🤝 It’s a draw':'💥 Gloomberry wins';
 $('eScore').innerHTML='Rounds <b>'+wins[0]+' – '+wins[1]+'</b> on '+diff[0].toUpperCase()+diff.slice(1);
 const acc=stats.shots?Math.round(100*stats.hits/stats.shots):0;
 $('eStats').innerHTML='Accuracy <b>'+acc+'%</b> · Slashes landed <b>'+stats.slashes+'</b><br>Parries <b>'+stats.parries+'</b> · Deflects <b>'+stats.deflects+'</b> · Guard breaks <b>'+stats.breaks+'</b><br>'+
  'Your wins <b>'+rec.wins+'</b> · Streak <b>'+rec.streak+'</b> · Best <b>'+rec.best+'</b>';
 $('endOv').classList.remove('hidden');
 if(window.ArcadeUI&&ArcadeUI.adBreak)ArcadeUI.adBreak('fd-match-over');
 sfx(won?'win':'lose');
}
function hideAll(){['menuOv','pauseOv','endOv'].forEach(id=>$(id).classList.add('hidden'))}
function toMenu(){paused=false;state='menu';hideAll();$('menuOv').classList.remove('hidden');music('menu')}
function setPause(on){
 if(state!=='play'&&state!=='count'&&state!=='roundEnd')return;
 paused=on;$('pauseOv').classList.toggle('hidden',!on);
 if(on)$('resumeBtn').focus();
}

/* ===== combat ===== */
function pop(x,y,txt,col){pops.push({x,y,txt,col:col||'#fff',life:.9})}
function burst(x,y,cols,n,sp){for(let k=0;k<n;k++){const a=Math.random()*6.28,s=(sp||260)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.5+Math.random()*.4,max:.9,col:cols[k%cols.length],r:2+Math.random()*3,g:900})}}
const SPR=['#ff7ba9','#ffd43b','#8fd6a8','#9ecdf2','#b79df0','#fff'];
function hurt(f,d,kx,ky,stun){
 if(state!=='play'||f.ko)return;
 f.hp=Math.max(0,f.hp-d);f.flash=.12;
 if(kx!=null){f.vx=kx;f.vy=ky}
 if(stun)f.stun=Math.max(f.stun,stun);
 burst(cxOf(f),f.y+24,f.bot?['#9b7fe0','#c9b6ff','#fff']:['#ff8fb8','#ffd1e2','#fff'],8);
 pop(cxOf(f),f.y-36,'-'+Math.round(d),f.bot?'#ffd43b':'#ff5d7e');
 if(f.hp<=0){
  f.ko=true;f.stun=9;slowT=.8;shake=.35;sfx('ko');
  burst(cxOf(f),f.y+30,SPR,26,420);
  roundOver(1-f.i);
 }
}
function guardBreak(f){
 f.guard=0;f.blocking=false;f.stun=Math.max(f.stun,.6);
 pop(cxOf(f),f.y-44,'Guard break!','#ffd43b');sfx('crumble');burst(cxOf(f),f.y+30,['#fff','#ffe08a'],10);
}
function fire(f){
 const s=shoulder(f),a=f.aim+(Math.random()-.5)*.05;
 bullets.push({x:s.x+Math.cos(a)*30,y:s.y+Math.sin(a)*30,vx:Math.cos(a)*BULLET_V,vy:Math.sin(a)*BULLET_V,o:f.i,life:1.2,dmg:BULLET_DMG,c:SPR[(Math.random()*5)|0]});
 f.ammo--;f.fireCd=FIRE_CD*(f.bot?DIFF[diff].rof:1);if(!f.ammo)f.reloadT=RELOAD;
 if(!f.bot)stats.shots++;
 sfx('fire',{size:.5});
}
function trySlash(f,o){
 const r=f.lunge?96:76,cx=cxOf(f);
 const hb={x:f.face>0?cx:cx-r,y:f.y-10,w:r,h:FH+20};
 if(!overlap(o,hb)||o.ko)return;
 f.slashHit=true;
 const front=Math.sign(cx-cxOf(o))===o.face;
 if(o.blocking&&front){
  if(f.lunge){guardBreak(o);hurt(o,8,f.face*380,-240,null);if(!f.bot)stats.breaks++}
  else{
   f.stun=.45;f.vx=-f.face*380;o.guard-=12;o.vx=f.face*120;
   pop(cxOf(o),o.y-44,'Parry!','#8fd6a8');sfx('bump');sfx('zap');burst(cxOf(o)-o.face*-18,o.y+30,['#fff','#ffe08a'],10);
   if(!o.bot)stats.parries++;
  }
 }else{
  hurt(o,f.lunge?LUNGE_DMG:SLASH_DMG,f.face*(f.lunge?560:420),-320,.28);
  sfx('hit');shake=Math.max(shake,.15);
  if(!f.bot)stats.slashes++;
 }
}
function updBullets(dt){
 for(let k=bullets.length-1;k>=0;k--){
  const b=bullets[k];let dead=false;
  for(let s=0;s<2&&!dead;s++){
   b.x+=b.vx*dt/2;b.y+=b.vy*dt/2;
   if(solidAt(b.x,b.y)||b.x<0||b.x>W||b.y<0||b.y>H){dead=true;burst(b.x,b.y,[b.c],3,120);break}
   const t=fighters[1-b.o];
   if(t.ko||b.x<t.x-4||b.x>t.x+FW+4||b.y<t.y-4||b.y>t.y+FH+4)continue;
   const front=Math.sign(b.vx)===-t.face,el=SLASH_T-t.slashT;
   if(t.slashT>0&&el>.03&&el<.22&&front){
    b.vx=-b.vx;b.vy=-b.vy;b.o=t.i;b.dmg=BULLET_DMG+4;b.x+=Math.sign(b.vx)*10;
    pop(cxOf(t),t.y-44,'Deflect!','#9ecdf2');sfx('zap');if(!t.bot)stats.deflects++;
    continue;
   }
   dead=true;
   if(t.blocking&&front){t.guard-=7;burst(b.x,b.y,['#fff','#ffe08a'],5,160);sfx('bump');if(t.guard<=0)guardBreak(t)}
   else{t.vx+=Math.sign(b.vx)*70;hurt(t,b.dmg,null,null,0);sfx('hit');if(b.o===0)stats.hits++}
  }
  b.life-=dt;
  if(dead||b.life<=0)bullets.splice(k,1);
 }
}

/* ===== movement ===== */
function moveFighter(f,dt){
 const px=f.x;f.x+=f.vx*dt;
 for(const b of SOLID)if(overlap(f,b)){
  if(px+FW<=b.x+.5)f.x=b.x-FW;else if(px>=b.x+b.w-.5)f.x=b.x+b.w;
  else f.x=(cxOf(f)<b.x+b.w/2)?b.x-FW:b.x+b.w;
  f.vx=0;
 }
 const pb=f.y+FH;f.y+=f.vy*dt;f.ground=false;
 for(const b of BLOCKS){
  if(b.k==='plat'){
   if(f.vy>=0&&pb<=b.y+.5&&f.y+FH>b.y&&f.x+FW>b.x&&f.x<b.x+b.w){f.y=b.y-FH;f.vy=0;f.ground=true}
  }else if(overlap(f,b)){
   if(f.vy>0||pb<=b.y+.5){f.y=b.y-FH;f.ground=true}else f.y=b.y+b.h;
   f.vy=0;
  }
 }
 // touching a wall (for wall-run / wall-jump)
 f.wall=0;
 if(!f.ground){
  for(const b of SOLID){
   if(f.y+8<b.y+b.h&&f.y+FH-8>b.y){
    if(Math.abs(f.x+FW-b.x)<2.5)f.wall=1;
    else if(Math.abs(f.x-(b.x+b.w))<2.5)f.wall=-1;
   }
  }
 }
}
function updFighter(f,o,dt){
 const c=f.ctrl;
 f.fireCd-=dt;f.dashCd-=dt;f.slashCd-=dt;f.flash-=dt;f.lungeW-=dt;f.wjLock-=dt;
 if(f.reloadT>0){f.reloadT-=dt;if(f.reloadT<=0)f.ammo=MAG}
 if(f.stun>0)f.stun-=dt;
 const stunned=f.stun>0||f.ko;
 let mv=stunned?0:(c.right?1:0)-(c.left?1:0);
 f.blocking=!stunned&&c.block&&f.slashT<=0&&f.dashT<=0&&f.guard>0;
 if(!stunned&&f.slashT<=0&&f.dashT<=0)f.face=Math.cos(f.aim)>=0?1:-1;

 if(f.ground){f.coy=.08;f.airDash=true;f.wallRun=.45}else f.coy-=dt;
 if(c.jumpP){f.jumpBuf=.12;c.jumpP=false}else f.jumpBuf-=dt;

function botControls(dt){

 // react to the player's slash: block if close

 if(p.slashT<=0)ai.sawSlash=false;
 // incoming sprinkle: maybe deflect it with a slash
 for(const q of bullets)if(q.o===0&&Math.abs(q.x-bx)<120&&Math.abs(q.y-by)<50&&Math.sign(q.vx)===-Math.sign(q.x-bx||1)&&!q.seen){q.seen=true;if(Math.random()<D.deflect)c.slashP=true;else if(Math.random()<D.block*.25)ai.blockT=.25}

 if(ai.lungeT>0){ai.lungeT-=dt;if(ai.lungeT<=0)c.slashP=true}
 const los=clearLine(s.x,s.y,px,py-6);
 if(ai.t<=0){
  ai.t=D.react*(.6+Math.random()*.8);
  const close=Math.abs(dx)<95&&Math.abs(dy)<70;
  if(pickup&&b.hp<55&&Math.hypot(pickup.x-bx,pickup.y-by)<Math.hypot(pickup.x-px,pickup.y-py)+120){
   ai.move=Math.sign(pickup.x-bx);if(pickup.y<by-60&&Math.random()<.5)c.jumpP=true;
  }else if(close){

   if(p.blocking){if(Math.random()<D.agg){c.dashP=true;ai.move=Math.sign(dx);ai.lungeT=.06}else ai.move=-Math.sign(dx)}

  }else{

/* ===== update ===== */
function update(dt){
 for(let k=parts.length-1;k>=0;k--){const q=parts[k];q.life-=dt;q.vy+=(q.g||0)*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.life<=0)parts.splice(k,1)}
 for(let k=pops.length-1;k>=0;k--){const q=pops[k];q.life-=dt;q.y-=40*dt;if(q.life<=0)pops.splice(k,1)}

 if(state==='count'){
  const before=Math.ceil(countT);countT-=dt;const after=Math.ceil(countT);
  if(after!==before&&after>0)sfx('count');
  if(countT<=0){state='play';sfx('go');banner='Duel!';bannerT=.7}
  return;
 }
 if(state!=='play'&&state!=='roundEnd')return;
 const [p,b]=fighters;
 if(state==='play'){playerControls();botControls(dt)}
 else{for(const f of fighters){Object.assign(f.ctrl,{left:false,right:false,shoot:false,block:false})}}
 updFighter(p,b,dt);updFighter(b,p,dt);
 updBullets(dt);
 if(state==='play'){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;roundOver(p.hp>b.hp?0:b.hp>p.hp?1:null)}
  pickT-=dt;
  if(!pickup&&pickT<=0){const s=PICK_SPOTS[(Math.random()*PICK_SPOTS.length)|0];pickup={x:s.x,y:s.y,t:0};sfx('item')}
  if(pickup){
   pickup.t+=dt;
   for(const f of fighters)if(!f.ko&&Math.abs(cxOf(f)-pickup.x)<30&&Math.abs(f.y+FH/2-pickup.y)<44){
    f.hp=Math.min(HPMAX,f.hp+25);pop(pickup.x,pickup.y-20,'+25','#8fd6a8');sfx('pickup');burst(pickup.x,pickup.y,SPR,12);pickup=null;pickT=15;break;
   }
  }
 }else{
  endT-=dt;
  if(endT<=0){
   if(wins[0]>=WIN_ROUNDS||wins[1]>=WIN_ROUNDS||round>=MAX_ROUNDS)matchOver();
   else{round++;startRound()}
  }
 }
}

 g.fillStyle=fro[2];g.beginPath();g.moveTo(sx*-6,-64);g.quadraticCurveTo(sx*4,-74,sx*2,-80);g.quadraticCurveTo(sx*-4,-70,sx*-6,-64);g.fill();g.stroke();

  const r=f.lunge?96:76;
  ctx.save();ctx.translate(s.x,s.y);ctx.scale(f.face,1);
  if(el>.03&&el<.24){ctx.strokeStyle=f.lunge?'rgba(255,212,59,.8)':'rgba(255,255,255,.85)';ctx.lineWidth=f.lunge?14:10;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,r-14,a0+.2,a);ctx.stroke()}
  ctx.rotate(a);drawBlade(ctx,r-6);ctx.restore();
 }
 // block: blade held upright + a sugar-glass shield
 if(f.blocking){
  ctx.save();ctx.translate(cx+f.face*22,by-36);ctx.rotate(-Math.PI/2+f.face*.15);drawBlade(ctx,50);ctx.restore();
  ctx.strokeStyle='rgba(158,205,242,.95)';ctx.fillStyle='rgba(158,205,242,.25)';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(cx,by-46,54,f.face>0?-1.1:Math.PI-1.1,f.face>0?1.1:Math.PI+1.1);ctx.fill();ctx.stroke();
 }
 if(f.stun>0&&!f.ko){for(let k=0;k<3;k++){const a=t*6+k*2.1;ctx.fillStyle='#ffd43b';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('★',cx+Math.cos(a)*18,by-104+Math.sin(a)*5)}}
 if(f.wallRunning&&Math.random()<.4)parts.push({x:f.wall>0?f.x+FW:f.x,y:f.y+FH-6,vx:-f.wall*40,vy:60,life:.3,max:.3,col:'#fff',r:3,g:0});
}
function bar(x,y,w,h,v,col,back,right){
 rr(ctx,x,y,w,h,h/2);ctx.fillStyle=back;ctx.fill();
 const ww=Math.max(0,w*v);if(ww>1){rr(ctx,right?x+w-ww:x,y,ww,h,h/2);ctx.fillStyle=col;ctx.fill()}
 rr(ctx,x,y,w,h,h/2);ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();
}
const FONT='"Baloo 2","Trebuchet MS",system-ui,sans-serif';
function drawHud(){
 const [p,b]=fighters;
 ctx.textBaseline='middle';
 // names, hp, guard
 ctx.font='900 22px '+FONT;ctx.textAlign='left';ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=4;
 ctx.strokeText('Swirl (you)',46,44);ctx.fillText('Swirl (you)',46,44);
 ctx.textAlign='right';ctx.strokeText('Gloomberry',W-46,44);ctx.fillText('Gloomberry',W-46,44);
 bar(46,60,400,22,p.hp/HPMAX,p.hp<30?'#ff5d7e':'#ff8fb8','#fff1f7');
 bar(W-446,60,400,22,b.hp/HPMAX,b.hp<30?'#ff5d7e':'#9b7fe0','#f1ebff',true);
 bar(46,88,180,9,p.guard/GUARD_MAX,'#9ecdf2','#fff');
 bar(W-226,88,180,9,b.guard/GUARD_MAX,'#9ecdf2','#fff',true);
 // ammo
 ctx.textAlign='left';ctx.font='800 16px '+FONT;
 const am=p.reloadT>0?'Reloading…':'✨'.repeat(p.ammo)+'·'.repeat(MAG-p.ammo);
 ctx.fillStyle=INK;ctx.fillText(am,236,93);
 // rounds + timer
 for(let k=0;k<WIN_ROUNDS;k++){
  ctx.fillStyle=k<wins[0]?'#ff7ba9':'#fff';ctx.beginPath();ctx.arc(560+k*26,58,9,0,7);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=k<wins[1]?'#9b7fe0':'#fff';ctx.beginPath();ctx.arc(W-560-k*26,58,9,0,7);ctx.fill();ctx.stroke();
 }
 rr(ctx,W/2-44,36,88,44,14);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.stroke();
 ctx.textAlign='center';ctx.font='900 28px '+FONT;ctx.fillStyle=timeLeft<10?'#e0548b':INK;ctx.fillText(Math.ceil(timeLeft),W/2,60);
}
function drawBanner(txt,size,alpha){
 ctx.save();ctx.globalAlpha=alpha;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+size+'px '+FONT;
 ctx.lineWidth=10;ctx.strokeStyle='#8a4a6a';ctx.lineJoin='round';ctx.strokeText(txt,W/2,H/2-40);
 ctx.fillStyle='#fff6e8';ctx.fillText(txt,W/2,H/2-40);ctx.restore();
}
function draw(t){
 if(!bg)buildBg();
 ctx.setTransform(1,0,0,1,0,0);
 const sc=cv.width/W;
 ctx.setTransform(sc,0,0,sc,0,0);
 if(shake>0){ctx.translate((Math.random()-.5)*14*shake/.35,(Math.random()-.5)*14*shake/.35)}
 ctx.drawImage(bg,0,0);
 if(!fighters.length){return}
 if(pickup){
  const y=pickup.y+Math.sin(pickup.t*4)*4;
  ctx.save();ctx.translate(pickup.x,y+16);ctx.scale(.7,.7);drawCupcake(ctx,{bot:false,face:1,ground:false,walk:0},t);ctx.restore();
  ctx.fillStyle='#3f9f6a';ctx.font='900 18px '+FONT;ctx.textAlign='center';ctx.fillText('+',pickup.x+18,y-30);
 }
 for(const q of bullets){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(Math.atan2(q.vy,q.vx));ctx.fillStyle=q.c;rr(ctx,-9,-3,18,6,3);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}
 fighters.forEach(f=>drawFighter(f,t));
 for(const q of parts){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill()}
 ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const q of pops){ctx.globalAlpha=Math.min(1,q.life*2);ctx.font='900 22px '+FONT;ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.strokeText(q.txt,q.x,q.y);ctx.fillStyle=q.col;ctx.fillText(q.txt,q.x,q.y)}
 ctx.globalAlpha=1;
 drawHud();
 if(state==='count')drawBanner(countT>2.2?banner:String(Math.ceil(countT)),countT>2.2?64:96,1);
 else if(bannerT>0)drawBanner(banner,64,Math.min(1,bannerT*2));
}

/* ===== loop + layout ===== */
let last=performance.now(),acc=0;
function frame(now){
 let dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused&&state!=='menu'&&state!=='over'){
  if(slowT>0){slowT-=dt;dt*=.35}
  shake=Math.max(0,shake-dt);
  acc+=dt;let n=0;while(acc>=STEP&&n<12){update(STEP);acc-=STEP;n++}
  if(n>=12)acc=0;
 }
 draw(now/1000);
 requestAnimationFrame(frame);
}
function fit(){
 const st=$('stage'),r=st.getBoundingClientRect();
 const aw=Math.max(200,r.width-16),ah=Math.max(120,r.height-16);
 const w=Math.min(aw,ah*16/9),h=w*9/16;
 cv.style.width=Math.round(w)+'px';cv.style.height=Math.round(h)+'px';
 const dpr=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*9/16);
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);

/* ===== menu wiring ===== */
function portraits(){
 [['pSwirl',false],['pGloom',true]].forEach(([id,bot])=>{
  const c=$(id),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.save();g.translate(84,178);g.scale(1.9,1.9);
  drawCupcake(g,{bot,face:bot?-1:1,ground:true,walk:0},performance.now()/1000);g.restore();
 });
}
document.querySelectorAll('.diff .arc-btn').forEach(b=>{
 b.setAttribute('aria-pressed',String(b.dataset.d===diff));
 b.addEventListener('click',()=>{diff=b.dataset.d;try{localStorage.setItem('fd-diff',diff)}catch(e){}
  document.querySelectorAll('.diff .arc-btn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));sfx('select')});
});
$('startBtn').addEventListener('click',()=>{sfx('select');startMatch()});
$('againBtn').addEventListener('click',()=>{sfx('select');startMatch()});
$('menuBtn').addEventListener('click',toMenu);
$('resumeBtn').addEventListener('click',()=>setPause(false));
$('quitBtn').addEventListener('click',toMenu);
fit();portraits();setInterval(()=>{if(state==='menu')portraits()},120);
music('menu');
requestAnimationFrame(frame);
// read-only peek for automated tests
window.FrostedDuel={get state(){return{state,round,wins:wins.slice(),timeLeft,diff,fighters:fighters.map(f=>({x:f.x,y:f.y,hp:f.hp,guard:f.guard,ammo:f.ammo,ground:f.ground,wall:f.wall,ko:f.ko}))}}};
</script>
